<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Sinfonías Resonantes</title>
  <meta name="description" content="Experiencia audiovisual interactiva: acuarela, ruptura tecnológica y un tercer lenguaje." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300&family=IBM+Plex+Mono:wght@300;400&display=swap" rel="stylesheet" />
</head>
<body>
  <canvas id="stage"></canvas>

  <div id="intro" role="button" tabindex="0">
    <div class="intro-inner">
      <h1>Sinfonías Resonantes</h1>
      <p class="sub">acuarela · ruptura · encuentro</p>
      <p class="begin">haz clic para comenzar <span>— con sonido</span></p>
    </div>
  </div>

  <div id="hint" class="hint" aria-live="polite"></div>
  <div id="toast"></div>
  <div id="cursor"></div>
  <div id="hands"></div>
  <div id="ring"></div>
  <video id="cam" playsinline muted></video>
  <div class="controls">
    <button id="handsBtn" type="button">manos · no</button>
    <button id="sound" type="button">sonido · sí</button>
  </div>
  <div id="fatal"></div>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
